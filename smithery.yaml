# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - tallyApiKey
    properties:
      tallyApiKey:
        type: string
        description: The API key for the Tally server.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    config => ({command: 'bun', args: ['run', 'start'], env: {TALLY_API_KEY: config.tallyApiKey}})